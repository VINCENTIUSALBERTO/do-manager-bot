name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Smoke-test bot module
        env:
          BOT_TOKEN: ci:dummy
          MONGODB_URI: mongodb://localhost:27017/ci-smoke
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          node -e "
            import('./src/bot.js').then(({ createBot }) => {
              const bot = createBot();
              if (typeof bot.launch !== 'function') {
                console.error('bot.launch missing');
                process.exit(1);
              }
              console.log('bot ok');
            }).catch(err => { console.error(err); process.exit(1); });
          "
